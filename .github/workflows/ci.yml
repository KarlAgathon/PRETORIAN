name: CI

# Every branch and pull request: checks and an UNSIGNED release build.
# Nothing is published from here (Prime Directive §10).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache Robolectric Android jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-4.14.1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Source sanity check
        run: |
          big=$(find app/src -name '*.kt' ! -name 'I18n*.kt' -size +400k)
          if [ -n "$big" ]; then echo "::error::Suspiciously large source files: $big"; exit 1; fi
      - name: Unit tests and unsigned release build
        run: gradle testReleaseUnitTest assembleRelease assembleBeta --no-daemon || (sleep 20 && gradle testReleaseUnitTest assembleRelease assembleBeta --no-daemon)
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
      - name: Translation check
        if: always()
        run: python3 tools/check_i18n.py
