name: Beta APK

# Runs only when a branch redesign-beta/<n> is pushed (a manual start would need this file on main, which stays untouched;
# tags cannot be pushed from the development session).
# Builds the signed BETA APK (com.pretorian.tv.beta, installs next to Stable) and keeps it as a workflow artifact
# for 14 days, and as a GitHub PRE-release "redesign-beta-<n>" (never "latest": Stable's updater ignores pre-releases
# and reads only releases/latest/update.json). No update.json, main untouched.
on:
  push:
    branches: ["redesign-beta/**"]

permissions:
  contents: read

jobs:
  beta:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache Robolectric Android jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-4.14.1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Signing key
        env:
          KS: ${{ secrets.LEAD_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.LEAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KEY_PASSWORD" ]; then echo "::error::Signing secrets missing"; exit 1; fi
          echo "$KS" | base64 -d > app/release.keystore
      - run: python3 tools/check_i18n.py
      - run: gradle testReleaseUnitTest assembleBeta --no-daemon || (sleep 20 && gradle testReleaseUnitTest assembleBeta --no-daemon)
        env:
          LEAD_KEY_PASSWORD: ${{ secrets.LEAD_KEY_PASSWORD }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
      - name: Remove signing key
        if: always()
        run: rm -f app/release.keystore
      - name: Name the APK
        run: cp app/build/outputs/apk/beta/*.apk "MediaCenterBeta-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: MediaCenterBeta-${{ github.run_number }}
          path: MediaCenterBeta-${{ github.run_number }}.apk
          retention-days: 14
      - name: Pre-release for the owner's download (not latest, not Stable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${GITHUB_REF_NAME#redesign-beta/}
          gh release create "redesign-beta-$N" "MediaCenterBeta-${{ github.run_number }}.apk" --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" --prerelease --latest=false --title "Media Center Beta $N (redesign, not Stable)" \
            --notes "Beta package com.pretorian.tv.beta – installs next to Stable with its own data. Not a Stable release."
